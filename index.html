<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Upgrade</title>
<meta name="description" content="A personal-development app: habits, goals, journal, meditation, reading and training in one place. Runs in the browser, no account needed.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app" id="app">
  <aside class="rail">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2" stroke="#C9A227" stroke-width="1.3"/>
        <path d="M12 17.2V7.4M12 7.4l-3.4 3.5M12 7.4l3.4 3.5" stroke="#EDE7DA" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="word">Upgrade</span>
    </div>
    <div class="hello" id="railHello"></div>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot">
      <button class="frow" id="syncBtn"><span class="dot local" id="syncDot"></span><span class="ftext"><span id="syncTxt">Saved in this browser</span><br><span id="savedStamp" class="mono" style="font-size:.66rem;color:var(--ivory-3)"></span></span></button>
      <button class="frow" id="exportBtn"><span style="width:6px"></span><span class="ftext">Export my data</span></button>
      <button class="frow" id="importBtn"><span style="width:6px"></span><span class="ftext">Import a backup</span></button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="frow" id="bgBtn"><span style="width:6px"></span><span class="ftext">Background</span></button>
      <button class="frow" id="collapseBtn"><span style="width:6px"></span><span class="ftext">Collapse menu</span></button>
    </div>
  </aside>

  <main class="stage">
    <div class="section-controls" id="sectionControls" hidden>
      <button class="iconbtn" id="sectionBack" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button>
      <button class="iconbtn" id="sectionMenu" aria-label="Open menu" aria-expanded="false" aria-controls="nav" title="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <span class="section-name" id="sectionName"></span>
    </div>
    <section class="view on" id="v-today"></section>
    <section class="view" id="v-goals"></section>
    <section class="view" id="v-habits"></section>
    <section class="view" id="v-journal"></section>
    <section class="view" id="v-meditate"></section>
    <section class="view" id="v-read"></section>
    <section class="view" id="v-move"></section>
    <section class="view" id="v-cardio"></section>
    <section class="view" id="v-mind"></section>
    <section class="view" id="v-coach"></section>
    <section class="view" id="v-progress"></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<script src="js/data/content.js"></script>
<script src="js/data/exercises.js"></script>
<script src="js/data/strength-standards.js"></script>
<script src="js/app.js"></script>

</body>
</html>
